<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dev tests</title>
  <style>
    body { margin: 0; padding: 16px; background: #f3efe6; color: #1d1412; font-family: system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 24px 0 8px; }
    p { margin: 0 0 12px; color: #6b5d50; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .cards figure { margin: 0; }
    .cards canvas { width: 100%; height: auto; display: block; }
    figcaption { font-size: 13px; color: #6b5d50; margin-top: 4px; }
    table { border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: 4px 10px; text-align: right; }
    a { color: #1d1412; }
  </style>
</head>
<body>
  <h1>Developer test page</h1>
  <p>Not linked from the app. Language: <a href="?lang=zh-HK">zh-HK</a> · <a href="?lang=en">en</a></p>

  <h2>Card samples (one per rarity + stress tests)</h2>
  <div class="cards" id="cards"></div>

  <h2>Rarity distribution (10,000 rolls)</h2>
  <div id="rarity"></div>

  <script type="module">
    import { setLang, t } from '../js/i18n.js';
    import { loadJSON } from '../js/data.js';
    import { renderCard } from '../js/render-card.js';
    import { baseAvatar, randomAvatar } from '../js/avatar.js';
    import { rollRarity } from '../js/rarity.js';

    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh-HK';
    await setLang(lang, { remember: false });
    const [config, types, avatar, skills, descriptions] = await Promise.all([
      loadJSON('data/config.json'), loadJSON('data/types.json'), loadJSON('data/avatar.json'),
      loadJSON(`data/skills/${lang}.json`), loadJSON(`data/descriptions/${lang}.json`),
    ]);
    const data = { config, types, avatar, skills, descriptions };

    let seed = 5;
    const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const p = (id) => ({ id, name: '', desc: '' });
    const samples = [
      { label: 'N · boy base · late', card: { name: '阿明', avatar: baseAvatar(avatar, 0), type: 'late', stats: [80, 70, 90, 0, 60], move: p('m1'), trait: p('t3'), weakness: p('w1'), desc: { id: 'd1', text: '' }, rarity: 'N' } },
      { label: 'R · girl base · foodie', card: { name: 'Sam', avatar: baseAvatar(avatar, 1), type: 'foodie', stats: [60, 60, 60, 60, 60], move: p('m4'), trait: p('t2'), weakness: p('w4'), desc: { id: 'd4', text: '' }, rarity: 'R' } },
      { label: 'SR · random · work', card: { name: '老細', avatar: randomAvatar(avatar, 0, rand), type: 'work', stats: [100, 85, 20, 95, 0], move: p('m5'), trait: p('t5'), weakness: p('w5'), desc: { id: 'd5', text: '' }, rarity: 'SR' } },
      { label: 'SSR · random · savage', card: { name: 'Jessica', avatar: randomAvatar(avatar, 1, rand), type: 'savage', stats: [40, 100, 100, 30, 30], move: p('m2'), trait: p('t1'), weakness: p('w2'), desc: { id: 'd2', text: '' }, rarity: 'SSR' } },
      { label: 'Stress · max-length custom text + emoji', card: { name: '超級無敵遲到王阿明仔😂', avatar: randomAvatar(avatar, 0, rand), type: 'love', stats: [20, 20, 20, 140, 100].map((v) => Math.min(v, 100)), move: { id: 'custom', name: 'Supercalifragilistic', desc: '一句好長好長嘅描述睇吓會唔會爆出張卡外面😂😂' }, trait: { id: 'custom', name: '自己寫嘅特性名稱好長', desc: '' }, weakness: p('w3'), desc: { id: 'custom', text: 'A very long custom description to check wrapping works fine' }, rarity: 'SSR' } },
      { label: 'Stress · long English name', card: { name: 'Bartholomew', avatar: randomAvatar(avatar, 0, rand), type: 'slacker', stats: [50, 50, 100, 50, 50], move: p('m3'), trait: p('t4'), weakness: p('w2'), desc: { id: 'd3', text: '' }, rarity: 'R' } },
    ];

    const box = document.getElementById('cards');
    for (const s of samples) {
      const fig = document.createElement('figure');
      const canvas = document.createElement('canvas');
      const cap = document.createElement('figcaption');
      cap.textContent = s.label;
      fig.append(canvas, cap);
      box.append(fig);
      await renderCard(canvas, s.card, data);
    }

    const counts = Object.fromEntries(config.rarity.order.map((k) => [k, 0]));
    for (let i = 0; i < 10000; i++) counts[rollRarity(config.rarity)]++;
    const rows = config.rarity.order.map((k) => `<tr><td>${k}</td><td>${config.rarity.odds[k]}%</td><td>${(counts[k] / 100).toFixed(1)}%</td></tr>`).join('');
    document.getElementById('rarity').innerHTML = `<table><tr><th>Rarity</th><th>Target</th><th>Rolled</th></tr>${rows}</table>`;
    document.title = `Dev tests · ${t('app.name')}`;
  </script>
</body>
</html>
