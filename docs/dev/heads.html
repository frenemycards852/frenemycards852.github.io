<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Head positions</title>
  <style>
    body { margin: 0; padding: 16px; background: #f3efe6; color: #1d1412; font-family: system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: #6b5d50; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .grid button { padding: 0; border: 3px solid transparent; background: none; cursor: pointer; }
    .grid button[aria-pressed="true"] { border-color: #ff5a36; }
    .grid canvas { display: block; width: 100%; height: auto; }
    .editor[hidden] { display: none; }
    .editor { display: grid; grid-template-columns: minmax(0, 420px) 1fr; gap: 16px; margin: 16px 0; align-items: start; }
    .pic { position: relative; touch-action: none; }
    .pic img { display: block; width: 100%; }
    .ring { position: absolute; border: 3px solid #ff2d55; border-radius: 50%; box-shadow: 0 0 0 2px #fff; transform: translate(-50%, -50%); cursor: move; }
    .ring::after { content: ""; position: absolute; left: 50%; top: -14px; width: 3px; height: 14px; background: #ff2d55; }
    label { display: block; margin: 8px 0; }
    input[type=range] { width: 100%; }
    pre { white-space: pre-wrap; background: #fff; padding: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Head positions (types.json → head)</h1>
  <p>Not linked from the app. Each card shows a test photo on the head. Tap a card, drag the ring onto the face, set size and tilt, then copy the JSON into types.json.</p>
  <div class="grid" id="grid"></div>
  <div class="editor" id="editor" hidden>
    <div class="pic" id="pic"><img id="img" alt=""><div class="ring" id="ring"></div></div>
    <div>
      <b id="which"></b>
      <label>Size <input type="range" id="r" min="0.03" max="0.2" step="0.001"></label>
      <label>Tilt <input type="range" id="angle" min="-40" max="40" step="1"></label>
      <pre id="out"></pre>
    </div>
  </div>
  <h2 style="font-size:16px">All heads (paste into types.json)</h2>
  <pre id="all"></pre>

  <script type="module">
    import { setLang } from '../js/i18n.js';
    import { loadJSON } from '../js/data.js';
    import { renderCard } from '../js/render-card.js';
    import { randomStats } from '../js/card.js';

    await setLang('zh-HK', { remember: false });
    const [config, types, skills, descriptions] = await Promise.all([
      loadJSON('data/config.json'), loadJSON('data/types.json'),
      loadJSON('data/skills/zh-HK.json'), loadJSON('data/descriptions/zh-HK.json'),
    ]);
    const data = { config, types, skills, descriptions };

    // Test photo: a face with a red "up" arrow, so position and tilt are easy to judge.
    const face = document.createElement('canvas');
    face.width = face.height = 256;
    const f = face.getContext('2d');
    f.fillStyle = '#7ec8ff'; f.fillRect(0, 0, 256, 256);
    f.fillStyle = '#ffd9b3'; f.beginPath(); f.ellipse(128, 140, 92, 108, 0, 0, Math.PI * 2); f.fill();
    f.fillStyle = '#222'; f.beginPath(); f.arc(95, 120, 12, 0, 7); f.arc(161, 120, 12, 0, 7); f.fill();
    f.lineWidth = 8; f.strokeStyle = '#c0262d'; f.beginPath(); f.arc(128, 165, 40, 0.2, Math.PI - 0.2); f.stroke();
    f.fillStyle = '#c0262d'; f.beginPath(); f.moveTo(128, 4); f.lineTo(112, 30); f.lineTo(144, 30); f.fill();
    const photo = face.toDataURL('image/png');

    const p = (id) => ({ id, name: '', desc: '' });
    const list = types.types.flatMap((type) => ['boy', 'girl'].flatMap((gender) => (type.art?.[gender] ?? []).map((entry, scene) => ({ type, gender, scene, entry, key: `${type.id}-${gender}-${scene + 1}` }))));
    const grid = document.getElementById('grid');
    const canvases = new Map();
    const draw = async ({ type, gender, scene, key }) => {
      const card = { name: key, gender, type: type.id, stats: randomStats(config.stats), move: p('m1'), trait: p('t1'), weakness: p('w1'), desc: { id: 'd1', text: '' }, rarity: 'R', photo, ...(scene > 0 ? { scene } : {}) };
      await renderCard(canvases.get(key), card, data);
    };
    const showAll = () => {
      document.getElementById('all').textContent = types.types.map((type) => `"${type.id}": "art": ${JSON.stringify(type.art)}`).join('\n');
    };
    for (const item of list) {
      const b = document.createElement('button');
      b.type = 'button';
      const c = document.createElement('canvas');
      canvases.set(item.key, c);
      b.append(c);
      b.addEventListener('click', () => {
        grid.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        edit(item);
      });
      grid.append(b);
      await draw(item);
    }
    showAll();

    // Editor: values are fractions of the picture (x, y, r) and degrees (tilt).
    const pic = document.getElementById('pic');
    const img = document.getElementById('img');
    const ring = document.getElementById('ring');
    let current = null;
    const round = (v) => Math.round(v * 1000) / 1000;
    function place() {
      const [x, y, r, a] = current.entry.head;
      const w = img.clientWidth;
      ring.style.left = `${x * 100}%`;
      ring.style.top = `${y * 100}%`;
      ring.style.width = ring.style.height = `${r * 2 * w}px`;
      ring.style.transform = `translate(-50%, -50%) rotate(${a}deg)`;
      document.getElementById('r').value = r;
      document.getElementById('angle').value = a;
      document.getElementById('out').textContent = JSON.stringify(current.entry.head);
    }
    async function update(values) {
      current.entry.head = values.map((v, i) => (i < 3 ? round(v) : Math.round(v)));
      place();
      showAll();
      await draw(current);
    }
    function edit(item) {
      current = item;
      document.getElementById('editor').hidden = false;
      document.getElementById('which').textContent = item.key;
      img.onload = place;
      img.src = `../${item.entry.src}`;
    }
    let dragging = false;
    pic.addEventListener('pointerdown', (e) => { dragging = true; pic.setPointerCapture(e.pointerId); move(e); });
    pic.addEventListener('pointermove', (e) => { if (dragging) move(e); });
    pic.addEventListener('pointerup', () => { dragging = false; draw(current); });
    function move(e) {
      const box = img.getBoundingClientRect();
      const [, , r, a] = current.entry.head;
      current.entry.head = [round((e.clientX - box.left) / box.width), round((e.clientY - box.top) / box.height), r, a];
      place();
      showAll();
    }
    document.getElementById('r').addEventListener('input', (e) => { const h = current.entry.head; update([h[0], h[1], Number(e.target.value), h[3]]); });
    document.getElementById('angle').addEventListener('input', (e) => { const h = current.entry.head; update([h[0], h[1], h[2], Number(e.target.value)]); });
  </script>
</body>
</html>
