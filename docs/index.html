<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4dc">
  <link rel="icon" href="data:,">
  <title></title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/" data-i18n="app.name"></a>
      <button class="lang-btn" type="button" id="lang-btn"
              data-i18n="lang.switch" data-i18n-aria-label="lang.switchLabel"></button>
    </header>

    <main id="app" class="view" tabindex="-1"></main>

    <footer class="footer">
      <p data-i18n="footer.privacy"></p>
      <p data-i18n="footer.disclaimer"></p>
    </footer>
  </div>

  <!-- View templates: text comes from locale files via data-i18n -->
  <template id="view-home">
    <section class="home">
      <h1 class="home-title" data-i18n="app.name"></h1>
      <p class="home-tagline" data-i18n="home.tagline"></p>
      <div class="home-card"></div>
      <div class="actions">
        <a class="btn btn-primary" href="#/make" data-i18n="home.make"></a>
        <a class="btn btn-secondary" href="#/album" data-i18n="home.album"></a>
      </div>
      <p class="home-hint" data-i18n="home.hint"></p>
    </section>
  </template>

  <template id="view-album">
    <section class="soon">
      <h1 data-i18n="album.title"></h1>
      <p data-i18n="soon.text"></p>
      <a class="btn btn-secondary" href="#/" data-i18n="nav.back"></a>
    </section>
  </template>
</body>
</html>
