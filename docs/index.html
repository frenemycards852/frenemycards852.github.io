<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4dc">
  <!-- Light design only: stops Android "auto dark" modes from repainting the page. -->
  <meta name="color-scheme" content="only light">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Home-screen app (iPhone): full screen, light status bar, short name under the icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="損友圖鑑">
  <!-- Link previews (WhatsApp, IG, Threads…). Crawlers don't run JS, so this text can't come
       from the locale files; keep it in step with app.name / app.shareTagline. og:image must be
       an absolute URL. Regenerate the image with tools/make-share-images.ps1. -->
  <meta name="description" content="將朋友變成抽水卡牌，再嚟一場對決！ Turn your friends into roast cards. Then battle it out.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="損友圖鑑 Frenemy Cards">
  <meta property="og:title" content="損友圖鑑 Frenemy Cards">
  <meta property="og:description" content="將朋友變成抽水卡牌，再嚟一場對決！ Turn your friends into roast cards. Then battle it out.">
  <meta property="og:url" content="https://frenemycards852.github.io/">
  <meta property="og:image" content="https://frenemycards852.github.io/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="損友圖鑑 Frenemy Cards: two friend cards facing off">
  <meta name="twitter:card" content="summary_large_image">
  <title>損友圖鑑 Frenemy Cards</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Splash until the first view is drawn (main.js removes it). No text: the language is not loaded yet. -->
  <div class="splash" id="splash" aria-hidden="true">
    <img class="splash-icon" src="assets/icons/icon-192.png" alt="" width="96" height="96">
    <span class="splash-dots"><i></i><i></i><i></i></span>
  </div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/"><img class="brand-icon" src="assets/icons/icon-192.png" alt="" width="32" height="32"><span data-i18n="app.name"></span></a>
      <button class="lang-btn" type="button" id="lang-btn"
              data-i18n="lang.switch" data-i18n-aria-label="lang.switchLabel"></button>
    </header>

    <main id="app" class="view" tabindex="-1"></main>

    <footer class="footer">
      <p data-i18n="footer.privacy"></p>
      <p data-i18n="footer.disclaimer"></p>
    </footer>
  </div>

  <!-- View templates: text comes from locale files via data-i18n -->
  <template id="view-home">
    <section class="home">
      <h1 class="home-title" data-i18n="app.name"></h1>
      <p class="home-tagline" data-i18n="home.tagline"></p>
      <div class="home-fan"></div>
      <div class="actions">
        <a class="btn btn-primary" href="#/make" data-i18n="home.make"></a>
        <a class="btn btn-secondary" href="#/album" data-i18n="home.album"></a>
      </div>
      <h2 class="home-how-title" data-i18n="home.howTitle"></h2>
      <ol class="home-steps">
        <li><span class="home-step-icon" aria-hidden="true" data-i18n="home.step1Icon"></span><span data-i18n="home.step1"></span></li>
        <li><span class="home-step-icon" aria-hidden="true" data-i18n="home.step2Icon"></span><span data-i18n="home.step2"></span></li>
        <li><span class="home-step-icon" aria-hidden="true" data-i18n="home.step3Icon"></span><span data-i18n="home.step3"></span></li>
      </ol>
    </section>
  </template>

</body>
</html>
